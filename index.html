<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whiteboard - Ansh Kumar Verma</title>
<meta name="author" content="Ansh Kumar Verma">
<meta name="description" content="A minimal whiteboard: pen, eraser, rectangle, circle and text, with configurable shortcuts and dark mode.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231971c2'/%3E%3Cpath d='M11 21l1.7-4.9L21.4 7.4a2.1 2.1 0 0 1 3 3l-8.6 8.7z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body data-tool="pen">
<div id="app">
<div id="canvas-wrap">
<canvas id="canvas"></canvas>
<textarea id="text-editor" spellcheck="false" autocomplete="off"></textarea>
<div id="eraser-cursor"></div>
</div>

<div id="dock">
<nav id="toolbar" class="panel" aria-label="Tools">
<button class="tool-btn active" data-tool="pen" title="Pen (P)">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
</button>
<button class="tool-btn" data-tool="eraser" title="Eraser (E)">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
</button>
<button class="tool-btn" data-tool="rect" title="Rectangle (R)">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
</button>
<button class="tool-btn" data-tool="circle" title="Circle (O)">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/></svg>
</button>
<button class="tool-btn" data-tool="text" title="Text (T)">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" x2="15" y1="20" y2="20"/><line x1="12" x2="12" y1="4" y2="20"/></svg>
</button>
</nav>

<section id="properties" class="panel">
<div class="swatches">
<button class="swatch" data-swatch="ink" title="Ink (auto)" style="background:var(--ink)"></button>
<button class="swatch" data-swatch="#e03131" title="Red" style="background:#e03131"></button>
<button class="swatch" data-swatch="#2f9e44" title="Green" style="background:#2f9e44"></button>
<button class="swatch" data-swatch="#1971c2" title="Blue" style="background:#1971c2"></button>
<button class="swatch" data-swatch="#f08c00" title="Orange" style="background:#f08c00"></button>
<input type="color" id="custom-color" value="#1971c2" title="Custom color">
</div>
<div class="prop-row">
<span class="prop-label">Stroke</span>
<input type="range" id="width-range" min="1" max="24" step="1" value="3">
<span class="prop-value" id="width-val">3</span>
</div>
<div class="prop-row" id="font-row" hidden>
<span class="prop-label">Text size</span>
<input type="range" id="font-range" min="12" max="72" step="2" value="20">
<span class="prop-value" id="font-val">20</span>
</div>
</section>
</div>

<div id="top-right">
<button id="theme-toggle" class="icon-btn" title="Toggle theme">
<svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
<svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
</button>
<button id="settings-open" class="icon-btn" title="Settings">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
</button>
</div>

<div id="zoom-controls" class="panel">
<button id="zoom-out" class="zoom-btn" title="Zoom out (Ctrl -)">-</button>
<button id="zoom-reset" class="zoom-label" title="Reset zoom (Ctrl 0)">100%</button>
<button id="zoom-in" class="zoom-btn" title="Zoom in (Ctrl +)">+</button>
</div>

<footer id="credit">Made by Ansh Kumar Verma</footer>

<div id="settings-backdrop" hidden>
<div class="modal">
<header>
<h2>Keyboard shortcuts</h2>
<button id="settings-close" title="Close">&times;</button>
</header>
<div class="bind-rows">
<div class="bind-row"><span>Pen</span><button class="keybtn" data-tool="pen">P</button></div>
<div class="bind-row"><span>Eraser</span><button class="keybtn" data-tool="eraser">E</button></div>
<div class="bind-row"><span>Rectangle</span><button class="keybtn" data-tool="rect">R</button></div>
<div class="bind-row"><span>Circle</span><button class="keybtn" data-tool="circle">O</button></div>
<div class="bind-row"><span>Text</span><button class="keybtn" data-tool="text">T</button></div>
</div>
<footer>
<p class="hint">Click a key, then press any key. <kbd>Esc</kbd> cancels.</p>
<button id="binds-reset">Reset to defaults</button>
</footer>
</div>
</div>

<script src="app.js"></script>
</body>
</html>
